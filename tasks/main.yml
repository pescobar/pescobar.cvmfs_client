---

- name: Deploy cvmfs client
  block:

    - name: Install python3-debian (required by deb822_repository)
      ansible.builtin.apt:
        name: python3-debian
        cache_valid_time: 600

    # hosts configured by older versions of this role have a one-line .list
    # file and the key in trusted.gpg.d; apt refuses a repo defined twice with
    # different Signed-By values
    - name: Remove the old one-line cvmfs apt source and key
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/cvmfs.list
        - /etc/apt/trusted.gpg.d/cvmfs.gpg

    - name: Configure cvmfs apt repository
      ansible.builtin.deb822_repository:
        name: cvmfs
        uris: "{{ cvmfs_client_apt_repo_url }}"
        suites: "{{ ansible_facts['distribution_release'] }}-prod"
        components: main
        signed_by: "{{ cvmfs_client_apt_repo_url }}/cernvm.gpg"
      register: _cvmfs_apt_repo

    # deb822_repository does not refresh the apt cache itself
    - name: Install the cvmfs client
      ansible.builtin.apt:
        name:
          - autofs
          - cvmfs
        update_cache: "{{ _cvmfs_apt_repo is changed }}"

    - name: Deploy /etc/cvmfs/default.local
      ansible.builtin.copy:
        dest: /etc/cvmfs/default.local
        owner: root
        group: root
        mode: "0644"
        content: "{{ cvmfs_client_default_config }}"
      notify: Execute cvmfs_config setup


- name: Configure cvmfs repo bio.data.computecanada.ca
  tags: bio.data.computecanada
  block:

    - name: Create folder /etc/cvmfs/keys/computecanada.ca/
      ansible.builtin.file:
        path: /etc/cvmfs/keys/computecanada.ca/
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Deploy public key for computecanada.ca
      ansible.builtin.copy:
        dest: /etc/cvmfs/keys/computecanada.ca/computecanada.ca.pub
        owner: root
        group: root
        mode: '0644'
        content: |
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAywoR5f8l7uLEoNCUEHJs
          x2apjPGeRenhqkCy/8jiOhbD6mPg0KDxNEJ9srBIETKPwvbeSxz8yUMKnvTl7Zby
          QMs1a6/AmJI9OnaiaHb24PVbdgqcsAGTCrWFvli73cRRznC3BhOUooupC3SUjO4w
          FSmLY/W9d2UsVs3hiOkpw9npYEhWj7cN7tPY2F3K5skRDxXAckWZ+5UcG3U/lCA6
          ThFUDyqwsfcVNDaMLSyDA+aiAbCQt50npQ2jD6shcm9vMjyBvqPeP0dSA+uEhCGJ
          jAW/EA2moR23sBogOB20mWayF55D+YmHh4ZttmuRCFlcR2CJou2t8Rd1FUMBHi3A
          DwIDAQAB
          -----END PUBLIC KEY-----

    - name: Deploy config file for bio.data.computecanada.ca
      ansible.builtin.copy:
        dest: /etc/cvmfs/config.d/bio.data.computecanada.ca.local
        mode: '0644'
        content: |
          CVMFS_KEYS_DIR="/etc/cvmfs/keys/computecanada.ca"
          CVMFS_USE_GEOAPI=no
          CVMFS_SERVER_URL="http://cvmfs-s1-bio-arbutus.computecanada.ca:8000/cvmfs/@fqrn@"
      notify: Execute cvmfs_config setup

- name: Install Lmod dependencies
  tags: lmod
  ansible.builtin.apt:
    name:
      - lua5.3
      - lua-term
      - lua-filesystem
      - lua-posix
      - tcl

- name: Deploy /etc/profile.d/soft_stacks.sh
  tags: soft_stacks_profile
  ansible.builtin.copy:
    dest: /etc/profile.d/soft_stacks.sh
    owner: root
    group: root
    mode: "0644"
    content: "{{ cvmfs_client_soft_stacks_config }}"

